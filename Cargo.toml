[workspace]
resolver = "2"
members = ["crates/ime-core", "crates/ime-session", "crates/frontend-tsf", "crates/engine-hangul", "crates/easime-cli", "crates/frontend-wayland", "crates/easime", "crates/easime-config", "crates/engine-japanese", "crates/easime-dict-tool", "crates/easime-settings-model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/byeonggonlee/easime"
authors = ["Byeonggon Lee"]

# KWin restarts a crashed input method only if it died from a signal, so a
# panic must abort instead of unwinding to a normal exit code.
[profile.release]
panic = "abort"

# The Windows text service (frontend-tsf) is a DLL inside other programs: a bug
# in it must not take the program down. It unwinds, and every entry point
# catches the panic, writes it to the log and lets the key through. The DLL for
# the installer is built with `--profile dll` (packaging/windows/build.ps1).
[profile.dll]
inherits = "release"
panic = "unwind"
