name: Release

# Push a tag like v0.1.0 to build the Linux packages and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-packages:
    name: .deb and .rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Tag must match the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="easime"))')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version v$version" >&2
            exit 1
          fi

      - run: cargo build --release --locked -p easime
      - run: cargo deb -p easime --no-build
      - run: cargo generate-rpm -p crates/easime

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/debian/*.deb target/generate-rpm/*.rpm \
            --title "$GITHUB_REF_NAME" --generate-notes
