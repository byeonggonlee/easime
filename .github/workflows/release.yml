name: Release

# Push a tag like v0.1.0 to build the Linux packages and publish a release.
#
# The Windows installer is NOT published: it only contains the terminal demo
# until the Windows input method (TSF) exists (see packaging/windows). The CI
# builds and tests it on every push.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Tag matches the versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the daemon and the settings window versions
        run: |
          daemon="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="easime"))')"
          settings="$(cargo metadata --no-deps --format-version 1 --manifest-path settings/kde/Cargo.toml \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="easime-settings"))')"
          echo "tag $GITHUB_REF_NAME, easime $daemon, easime-settings $settings"
          if [ "v$daemon" != "$GITHUB_REF_NAME" ] || [ "v$settings" != "$GITHUB_REF_NAME" ]; then
            echo "the tag and both crate versions must be the same" >&2
            exit 1
          fi

  packages:
    name: Linux packages
    needs: tag
    uses: ./.github/workflows/packages.yml
    with:
      dictionary: mozc

  publish:
    name: Publish release
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easime-linux-packages-${{ github.sha }}
          path: dist
      - run: ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
