name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run the CI by hand on any branch (Actions tab -> CI -> Run workflow).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  portable:
    name: OS-independent crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      # Crates that must build on every OS (no Wayland/X11/Qt dependencies).
      PORTABLE: -p ime-core -p ime-session -p frontend-tsf -p engine-hangul -p engine-japanese -p easime-dict-tool -p easime-config -p easime-settings-model -p easime-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ env.PORTABLE }} --all-targets -- -D warnings
      # The Windows text service is a DLL; its test registers the built DLL
      # with regsvr32 and has COM load it, so build it first and insist on it.
      - name: Build the Windows text service DLL
        if: runner.os == 'Windows'
        run: cargo build -p frontend-tsf
      - run: cargo test ${{ env.PORTABLE }}
        env:
          EASIME_REQUIRE_DLL: ${{ runner.os == 'Windows' && '1' || '' }}
      # The experiment behind registering for every language
      # (docs/records/2026-11-08-windows-plan.md, step 2), kept as a watch on Windows: it
      # prints what Windows says about each way of registering (the "EXPERIMENT"
      # lines) and fails only if it cannot clean up after itself.
      - name: "Experiment: one input method under every language"
        if: runner.os == 'Windows'
        run: |
          cmd /c ver
          cargo test -p frontend-tsf --test languages -- --ignored --nocapture

  # The Windows text service as a 32-bit DLL, for the 32-bit programs of a PC
  # (an older messenger, a 32-bit Office, game launchers: a 32-bit program cannot
  # load a 64-bit DLL). The DLL is built for i686 and the tests of the crate run
  # as 32-bit programs: regsvr32 (the 32-bit one, from SysWOW64) registers the DLL
  # in the 32-bit view of the registry, COM loads it from there and the fake
  # application types Korean and Japanese through the real TSF.
  windows-32bit:
    name: Text service, 32-bit (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: i686
      - name: Build the 32-bit text service DLL
        run: cargo build -p frontend-tsf --target i686-pc-windows-msvc
      # What the DLL exports: regsvr32 and COM look for the plain names
      # (DllRegisterServer, DllGetClassObject), not stdcall-decorated ones.
      - name: What the 32-bit DLL exports
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /exports target\i686-pc-windows-msvc\debug\frontend_tsf.dll } else { "no dumpbin found" }
      - name: Test it as a 32-bit program
        run: cargo test -p frontend-tsf --target i686-pc-windows-msvc
        env:
          EASIME_REQUIRE_DLL: "1"

  # The Linux packages (one .rpm, one .deb) are built, installed into a clean
  # Fedora or Debian, and started; each CI run keeps them for download
  # (Actions run page -> Artifacts, easime-linux-packages-<commit>). They are the
  # same packages a release publishes, with the real Mozc dictionary.
  packages:
    name: Linux packages
    uses: ./.github/workflows/packages.yml

  # The Windows installer (MSI, WiX): the text service (TSF), registered with
  # Windows and switched on for the installing user, the Japanese dictionary,
  # the terminal demo and the licenses. The job builds it, installs it on the runner, checks what Windows
  # and the user's language settings say, uses what was installed, upgrades it and
  # removes it again, leaving nothing behind. The MSI is kept as an artifact for
  # trying it on a real PC (it is not published as a release: docs/implementation/windows.md).
  windows-installer:
    name: Windows installer (MSI, text service)
    runs-on: windows-latest
    # It takes about ten minutes; a step that hangs must not hold a runner for hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            settings/windows
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      # The real Mozc dictionary, built on Windows the way the Linux packages
      # build theirs (the pinned files are cached, checksums verified).
      - uses: actions/cache@v4
        with:
          path: target/mozc-src
          key: mozc-src-${{ hashFiles('scripts/fetch-mozc-dictionary.sh') }}
      - name: Build the Japanese dictionary (Mozc)
        shell: bash
        run: |
          sh scripts/build-dictionary.sh mozc
          found="$(cargo run -q --release --locked -p easime-dict-tool -- lookup target/dictionary/mozc.bin おおさか)"
          echo "$found"
          echo "$found" | grep -q '大阪'
      - name: Build the installer, and an older one for the upgrade test
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq "easime-cli" }).version
          .\packaging\windows\build.ps1 -Version 0.0.1 -OutDir target\upgrade-test
          .\packaging\windows\build.ps1 -Version $version
          "MSI_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # What the installer bundle will do on a PC without it.
      - name: Install the Windows App Runtime from Microsoft
        run: .\packaging\windows\runtime.ps1 -Install
      - name: Install, use, upgrade and remove it
        run: .\packaging\windows\test.ps1 -Msi "target\easime-$env:MSI_VERSION-x64.msi" -OldMsi target\upgrade-test\easime-0.0.1-x64.msi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easime-windows-installer-${{ github.sha }}
          path: |
            target/easime-*-x64.msi
            target/easime-setup-*-x64.exe
            msi-logs/*.log
          if-no-files-found: warn
          retention-days: 30

  # The Windows settings app (WinUI 3 through windows-reactor) is a separate
  # cargo project. It uses the Windows App Runtime installed from Microsoft
  # (easime does not redistribute it), which this job installs the way the
  # installer will: Microsoft's own runtime installer, from Microsoft. The
  # window is opened in every display language and a picture of each is kept.
  windows-settings:
    name: Settings app (Windows, WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: settings/windows
      - name: Format and lint
        working-directory: settings/windows
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: settings/windows
        run: cargo test --locked
      - name: Build
        working-directory: settings/windows
        run: |
          cargo build --locked
          Get-ChildItem target\debug -File | Sort-Object Name | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }
      - name: Install the Windows App Runtime from Microsoft
        run: .\packaging\windows\runtime.ps1 -Install
      - name: Open the window in every display language
        run: .\settings\windows\tests\open-window.ps1 -Exe settings\windows\target\debug\easime-settings.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-app-windows
          path: shots-windows/
          if-no-files-found: warn
          retention-days: 30

  # setup.exe on a fresh runner, which has the Windows App Runtime only staged,
  # not installed: it must download Microsoft's runtime installer, install
  # easime, open the settings app, and leave the runtime when easime goes.
  windows-setup:
    name: Windows setup.exe (runtime from Microsoft)
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: easime-windows-installer-${{ github.sha }}
          path: installer
      - name: Set up easime with setup.exe, remove it, set it up again
        run: |
          $setup = Get-ChildItem installer -Recurse -Filter "easime-setup-*-x64.exe" | Select-Object -First 1
          .\packaging\windows\test-setup.ps1 -Setup $setup.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easime-windows-setup-logs-${{ github.sha }}
          path: setup-logs/*.log
          if-no-files-found: warn
          retention-days: 30

  # The settings window needs Qt 6 and Kirigami, so it is built in Fedora (the
  # distribution the project targets) and is a separate cargo project that the
  # jobs above never touch. It opens every page without a display and keeps a
  # picture of each as an artifact.
  settings:
    name: Settings window (KDE, Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Qt 6, Kirigami and the Rust toolchain
        run: |
          dnf -y install git python3 cargo rust clippy rustfmt gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami kf6-kirigami-devel kf6-qqc2-desktop-style \
            google-noto-sans-cjk-fonts dejavu-sans-fonts breeze-icon-theme
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: settings/kde
      - name: Format and lint
        working-directory: settings/kde
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: settings/kde
        run: cargo test
      - name: Check the translations
        working-directory: settings/kde
        run: |
          python3 tests/check_translations.py
          # The display language logic, without any window.
          runner=/usr/lib64/qt6/bin/qmltestrunner
          if [ -x "$runner" ]; then
            QT_QPA_PLATFORM=offscreen QT_LOGGING_TO_CONSOLE=1 "$runner" -input tests/tst_tr.qml
          else
            echo "SKIPPED: $runner is not installed; only the static translation check ran"
          fi
      - name: Build
        working-directory: settings/kde
        run: cargo build
      - name: Open every page in every display language
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          XDG_RUNTIME_DIR: /tmp
          # Qt in Fedora sends messages to the systemd journal instead of
          # stderr when stderr is not a terminal; there is no journal here.
          QT_LOGGING_TO_CONSOLE: "1"
          LANG: C.UTF-8
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          fail=0
          check() {
            if ! "$@"; then echo "FAILED ($lang): $*"; fail=1; fi
          }
          mkdir -p shots

          # Each display language gets its own home, so every run starts from
          # the default settings and the clicks can be checked in the file.
          for lang in ko en ja zh-Hant zh-Hans; do
            echo "::group::display language $lang"
            log="settings-$lang.log"
            cfg="home-$lang/.config/easime/config.toml"
            rm -rf "home-$lang"; mkdir -p "shots/$lang" "home-$lang"
            # easime is "installed" in the user's applications folder, and the
            # session is KDE, so the window offers to select it as the input method.
            mkdir -p "home-$lang/.local/share/applications"
            printf '[Desktop Entry]\nType=Application\nName=easime\n' > "home-$lang/.local/share/applications/easime.desktop"
            set +e
            # The system language is neutral (C.UTF-8) so every run starts with
            # all input languages off; the display language is forced.
            env -u LANGUAGE -u LC_ALL LANG=C.UTF-8 XDG_CURRENT_DESKTOP=KDE \
              HOME="$PWD/home-$lang" XDG_CONFIG_HOME="$PWD/home-$lang/.config" XDG_STATE_HOME="$PWD/home-$lang/.state" \
              timeout 120 settings/kde/target/debug/easime-settings --ui-language="$lang" --screenshots="$PWD/shots/$lang" > "$log" 2>&1
            code=$?
            set -e
            echo "exit code: $code"
            # The page contents (indented lines) only for Korean; the rest of
            # the languages print the checkpoints.
            if [ "$lang" = ko ]; then cat "$log"; else grep -v '^ ' "$log"; fi
            echo "--- settings file after the clicks:"; cat "$cfg" || true
            echo "::endgroup::"

            check test "$code" = 0
            check grep -q "UI-LANGUAGE $lang\$" "$log"
            check grep -q 'SETTINGS-WINDOW-LOADED pages=5' "$log"
            check test "$(grep -c 'SCREENSHOT .* true' "$log" || true)" = 9
            # Selecting easime as the input method asks, changes kwinrc, and the
            # end of the tour undoes it.
            check grep -q 'INTERACTION activation-before state=other' "$log"
            check grep -q 'INTERACTION activation-after state=selected undo=true result=activated' "$log"
            check grep -q 'INTERACTION activation-undone state=other undo=false result=deactivated' "$log"
            if grep -q easime "home-$lang/.config/kwinrc"; then echo "FAILED ($lang): kwinrc still names easime after the undo"; fail=1; fi
            # Clicking the real controls must change the settings and the file.
            check grep -q 'INPUT-LANGUAGES languages= follow-system=true' "$log"
            check grep -q 'INTERACTION japanese-on languages=japanese switch=true result=saved' "$log"
            check grep -q 'INTERACTION toggle-key=hangul hangul=true both=false' "$log"
            check grep -q 'INTERACTION switch-mode=cycle cycle=true last=false' "$log"
            check grep -q 'INTERACTION indicator-box=false checkbox=false' "$log"
            check grep -q 'enabled = \["japanese"\]' "$cfg"
            check grep -q 'toggle_key = "hangul"' "$cfg"
            check grep -q 'switch = "cycle"' "$cfg"
            check grep -q 'indicator_box = false' "$cfg"
            check grep -q 'UX-CHECK language-order=korean,japanese' "$log"
            check grep -q 'UX-CHECK duration-seconds' "$log"
            if grep -q 'UX-CHECK-FAILED' "$log"; then echo "FAILED ($lang): settings UX regression"; fail=1; fi
            # Every text has a translation.
            if grep -E 'MISSING-TRANSLATION|TRANSLATIONS-INCOMPLETE' "$log"; then
              echo "FAILED ($lang): untranslated text (above)"; fail=1
            fi
            # QML warnings start with the file they come from (qrc:/...), or say
            # <Unknown File>; the window's own checkpoints start with "qml:".
            # Kirigami creates each page without a parent and puts it in the
            # page row afterwards, which Qt reports once per page; the pages do
            # render.
            grep -v 'Created graphical object was not placed in the graphics scene' "$log" > "$log.checked" || true
            if grep -E 'qrc:/|<Unknown File>|TypeError|ReferenceError|is not installed|is not a type|nable to assign|annot assign|is not defined|failed to load' "$log.checked"; then
              echo "FAILED ($lang): QML reported warnings or errors (above)"; fail=1
            fi
          done

          # Without --ui-language the system language decides.
          echo "::group::display language from the system language"
          mkdir -p home-detect
          detect() {
            got=$(env -u LANGUAGE -u LC_ALL HOME="$PWD/home-detect" XDG_CONFIG_HOME="$PWD/home-detect/.config" "$1" \
              timeout 15 settings/kde/target/debug/easime-settings 2>&1 | grep -m1 'UI-LANGUAGE' | sed 's/.*UI-LANGUAGE //' || true)
            echo "$1 -> $got (expected $2)"
            if [ "$got" != "$2" ]; then echo "FAILED: $1 gave '$got', expected '$2'"; fail=1; fi
          }
          detect LANG=ko_KR.UTF-8 ko
          detect LANG=ja_JP.UTF-8 ja
          detect LANG=zh_TW.UTF-8 zh-Hant
          detect LANG=zh_HK.UTF-8 zh-Hant
          detect LANG=zh_CN.UTF-8 zh-Hans
          detect LANG=fr_FR.UTF-8 en
          detect LANG=C.UTF-8 en
          got=$(env -u LC_ALL LANGUAGE=ja HOME="$PWD/home-detect" XDG_CONFIG_HOME="$PWD/home-detect/.config" \
            timeout 15 settings/kde/target/debug/easime-settings 2>&1 | grep -m1 'UI-LANGUAGE' | sed 's/.*UI-LANGUAGE //' || true)
          echo "LANGUAGE=ja -> $got (expected ja)"
          if [ "$got" != "ja" ]; then echo "FAILED: LANGUAGE=ja gave '$got'"; fail=1; fi
          echo "::endgroup::"

          # Until the user chooses, the input languages follow the system
          # language; anything but Korean or Japanese leaves them all off.
          echo "::group::input languages from the system language"
          mkdir -p home-input
          input() {
            expected="$1"; shift
            got=$(env -u LANGUAGE -u LC_ALL -u LC_MESSAGES "$@" HOME="$PWD/home-input" XDG_CONFIG_HOME="$PWD/home-input/.config" \
              timeout 15 settings/kde/target/debug/easime-settings --ui-language=en 2>&1 \
              | grep -m1 'INPUT-LANGUAGES' | sed 's/.*languages=\([^ ]*\) follow-system=\(.*\)/\1 \2/' || true)
            echo "$* -> '$got' (expected '$expected true')"
            if [ "$got" != "$expected true" ]; then echo "FAILED: $* gave '$got', expected '$expected true'"; fail=1; fi
          }
          input "korean" LANG=ko_KR.UTF-8
          input "japanese" LANG=ja_JP.UTF-8
          input "" LANG=en_US.UTF-8
          input "" LANG=fr_FR.UTF-8
          input "" LANG=C.UTF-8
          input "" LANG=zh_CN.UTF-8   # Chinese has no engine yet
          input "" LANG=zh_TW.UTF-8
          input "japanese,korean" LANG=en_US.UTF-8 LANGUAGE=ja:ko:en
          input "korean" LANG=en_US.UTF-8 LANGUAGE=en_US:ko
          echo "::endgroup::"

          test "$fail" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-window-pages
          path: |
            shots/*/*.png
            settings-*.log
          if-no-files-found: warn
          retention-days: 30
