name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run the CI by hand on any branch (Actions tab -> CI -> Run workflow).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  portable:
    name: OS-independent crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      # Crates that must build on every OS (no Wayland/X11/Qt dependencies).
      PORTABLE: -p ime-core -p engine-hangul -p engine-japanese -p easime-dict-tool -p easime-config -p easime-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ env.PORTABLE }} --all-targets -- -D warnings
      - run: cargo test ${{ env.PORTABLE }}

  packages:
    name: .deb and .rpm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deb cargo-generate-rpm
      - run: cargo build --release --locked -p easime
      # CI packages a tiny dictionary built from the committed fixture so the
      # job never downloads the big Mozc data; the release workflow builds the
      # real one (same file name, see crates/easime/Cargo.toml).
      - run: sh scripts/build-dictionary.sh sample
      - run: cargo deb -p easime --no-build
      - run: cargo generate-rpm -p crates/easime
      - name: Show package contents
        run: |
          dpkg-deb -I target/debian/*.deb
          dpkg-deb -c target/debian/*.deb
          rpm -qpl target/generate-rpm/*.rpm || true
      # Every CI run keeps its packages for download (Actions run page ->
      # Artifacts). These contain the tiny sample dictionary; the packages with
      # the real Mozc dictionary come from the release workflow (GitHub
      # Releases).
      - uses: actions/upload-artifact@v4
        with:
          name: easime-linux-packages-${{ github.sha }}
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

  # The settings window needs Qt 6 and Kirigami, so it is built in Fedora (the
  # distribution the project targets) and is a separate cargo project that the
  # jobs above never touch. It opens every page without a display and keeps a
  # picture of each as an artifact.
  settings:
    name: Settings window (KDE, Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    # New job: it must be seen green before it is allowed to fail the CI.
    continue-on-error: true
    steps:
      - name: Install Qt 6, Kirigami and the Rust toolchain
        run: |
          dnf -y install git cargo rust clippy rustfmt gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami kf6-kirigami-devel kf6-qqc2-desktop-style \
            google-noto-sans-cjk-fonts dejavu-sans-fonts breeze-icon-theme
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: settings/kde
      - name: Format and lint
        working-directory: settings/kde
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: settings/kde
        run: cargo test
      - name: Build
        working-directory: settings/kde
        run: cargo build
      - name: Open every page and take its picture
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          XDG_RUNTIME_DIR: /tmp
          # Qt in Fedora sends messages to the systemd journal instead of
          # stderr when stderr is not a terminal; there is no journal here.
          QT_LOGGING_TO_CONSOLE: "1"
          LANG: C.UTF-8
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          mkdir -p shots home
          export HOME="$PWD/home" XDG_CONFIG_HOME="$PWD/home/.config" XDG_STATE_HOME="$PWD/home/.state"
          set +e
          timeout 120 settings/kde/target/debug/easime-settings --screenshots="$PWD/shots" > settings.log 2>&1
          code=$?
          set -e
          echo "exit code: $code"
          echo "--- output of the settings window:"
          cat settings.log
          echo "--- installed KDE QML modules:"
          ls /usr/lib64/qt6/qml/org/kde/ || true
          ls /usr/lib64/qt6/qml/org/kde/desktop /usr/lib64/qt6/qml/org/kde/breeze 2>&1 | head -20 || true
          test "$code" = 0
          grep -q 'SETTINGS-WINDOW-LOADED pages=5' settings.log
          test "$(grep -c 'SCREENSHOT .* true' settings.log)" = 5
          # QML warnings start with the file they come from (qrc:/...), or say
          # <Unknown File>; the window's own checkpoints start with "qml:".
          if grep -E 'qrc:/|<Unknown File>|TypeError|ReferenceError|is not installed|is not a type|nable to assign|annot assign|is not defined|failed to load' settings.log; then
            echo "QML reported warnings or errors (above)"; exit 1
          fi
      # TEMPORARY: describe every page picture as text (how much of it is
      # background, where the content is, a coarse density map) so the pages
      # can be judged from the log. Remove once the pages were checked.
      - name: Describe the pictures as text
        if: always()
        run: |
          cat > /tmp/sketch.py <<'PY'
          import struct, sys, zlib
          from collections import Counter

          def read_png(path):
              data = open(path, "rb").read()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
              pos, idat = 8, b""
              while pos < len(data):
                  n, kind = struct.unpack(">I4s", data[pos:pos + 8])
                  body = data[pos + 8:pos + 8 + n]
                  pos += 12 + n
                  if kind == b"IHDR":
                      w, h, depth, ctype = struct.unpack(">IIBB", body[:10])
                  elif kind == b"IDAT":
                      idat += body
              assert depth == 8 and ctype in (2, 6), (depth, ctype)
              bpp = 3 if ctype == 2 else 4
              raw, stride, rows, prev, i = zlib.decompress(idat), w * bpp, [], bytearray(w * bpp), 0
              for _ in range(h):
                  f, line = raw[i], bytearray(raw[i + 1:i + 1 + stride])
                  i += 1 + stride
                  for x in range(stride):
                      a = line[x - bpp] if x >= bpp else 0
                      b = prev[x]
                      c = prev[x - bpp] if x >= bpp else 0
                      if f == 1: line[x] = (line[x] + a) & 255
                      elif f == 2: line[x] = (line[x] + b) & 255
                      elif f == 3: line[x] = (line[x] + ((a + b) >> 1)) & 255
                      elif f == 4:
                          p = a + b - c
                          pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                          pr = a if pa <= pb and pa <= pc else (b if pb <= pc else c)
                          line[x] = (line[x] + pr) & 255
                  rows.append(line)
                  prev = line
              return w, h, bpp, rows

          for name in sys.argv[1:]:
              w, h, bpp, rows = read_png("shots/%s.png" % name)
              pixel = lambda x, y: bytes(rows[y][x * bpp:x * bpp + 3])
              counts = Counter(pixel(x, y) for y in range(0, h, 2) for x in range(0, w, 2))
              background, background_n = counts.most_common(1)[0]
              total = sum(counts.values())
              cols, lines = 80, 30
              grid = []
              ink_x, ink_y = [], []
              for gy in range(lines):
                  row = ""
                  for gx in range(cols):
                      x0, x1 = gx * w // cols, (gx + 1) * w // cols
                      y0, y1 = gy * h // lines, (gy + 1) * h // lines
                      cells = [pixel(x, y) for y in range(y0, y1, 2) for x in range(x0, x1, 2)]
                      ink = sum(1 for p in cells if p != background) / max(1, len(cells))
                      if ink > 0.02:
                          ink_x.append(gx); ink_y.append(gy)
                      row += " " if ink < 0.02 else "." if ink < 0.10 else ":" if ink < 0.25 else "*" if ink < 0.5 else "#"
                  grid.append(row)
              print("=== %s: %dx%d, background #%s is %.0f%% of the picture, %d distinct colours" % (
                  name, w, h, background.hex(), 100 * background_n / total, len(counts)))
              if ink_x:
                  print("content spans columns %d-%d of %d, rows %d-%d of %d" % (
                      min(ink_x), max(ink_x), cols, min(ink_y), max(ink_y), lines))
              else:
                  print("NO CONTENT: the picture is one flat colour")
              print("\n".join(r.rstrip() for r in grid))
          PY
          python3 /tmp/sketch.py general languages shortcuts korean appearance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-window-pages
          path: |
            shots/*.png
            settings.log
          if-no-files-found: warn
          retention-days: 30
