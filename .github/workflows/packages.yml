name: Linux packages

# Builds and checks the Linux packages. The CI and the release workflow both
# call it, so a release is built by exactly the path the CI tests.
#
# There is one package per distribution, holding everything (the input method
# daemon, the settings window, both menu entries and the Japanese dictionary),
# so installing it is one step:
#
#   easime-<version>.x86_64.rpm   built in Fedora
#   easime_<version>_amd64.deb    built in Debian 13
#
# They are built where Qt 6 and Kirigami are (the settings window needs them),
# with that distribution's own libraries. Each package is then installed into a
# clean container of its distribution (dependencies resolved from the
# distribution, nothing else installed), the installed settings window is
# started, and the installed daemon is started far enough to see that it runs.
#
# The dictionary is the real Mozc one in the CI too: a package without it can
# only offer kana when converting Japanese, which hides real problems.

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  dictionary:
    name: Japanese dictionary (Mozc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The pinned Mozc files (checksums are verified by the script); cached so
      # a normal run does not download them again.
      - uses: actions/cache@v4
        with:
          path: target/mozc-src
          key: mozc-src-${{ hashFiles('scripts/fetch-mozc-dictionary.sh') }}
      - name: Build the dictionary
        run: sh scripts/build-dictionary.sh mozc
      - name: It is the real dictionary and knows common words
        run: |
          size="$(stat -c %s target/dictionary/mozc.bin)"
          echo "mozc.bin is $size bytes"
          test "$size" -gt 10000000
          found="$(cargo run -q --release --locked -p easime-dict-tool -- lookup target/dictionary/mozc.bin おおさか とうきょう にほん)"
          echo "$found"
          # Each word must offer its kanji, not only kana.
          echo "$found" | grep -q '^おおさか	.*大阪'
          echo "$found" | grep -q '^とうきょう	.*東京'
          echo "$found" | grep -q '^にほん	.*日本'
      - uses: actions/upload-artifact@v4
        with:
          name: dictionary
          path: target/dictionary/mozc.bin
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: easime .rpm (Fedora)
    needs: dictionary
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install the build tools, Qt 6 and libxkbcommon
        run: |
          # rpm-build: cargo-generate-rpm then finds the library requirements the
          # way rpmbuild does (without it, it lists private libproxy plugins).
          dnf -y install git cargo rust gcc gcc-c++ make rpm-build pkgconf-pkg-config \
            libxkbcommon-devel qt6-qtbase-devel qt6-qtdeclarative-devel
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            settings/kde -> target
      - uses: actions/download-artifact@v4
        with:
          name: dictionary
          path: target/dictionary
      - run: cargo install --locked cargo-generate-rpm
      - name: Build the daemon and the settings window
        run: |
          cargo build --release --locked -p easime
          cargo build --release --locked --manifest-path settings/kde/Cargo.toml
      - name: Make the .rpm
        run: cargo generate-rpm -p crates/easime
      - name: Show package contents
        run: |
          rpm -qpi target/generate-rpm/*.rpm
          rpm -qpl target/generate-rpm/*.rpm
          rpm -qpR target/generate-rpm/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: part-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  deb:
    name: easime .deb (Debian 13)
    needs: dictionary
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the build tools, Qt 6 and libxkbcommon
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config cmake dpkg-dev \
            libxkbcommon-dev qt6-base-dev qt6-declarative-dev libgl-dev
      # Debian's own Rust is older than this project needs; rustup gives the
      # current stable one.
      - name: Install the Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            settings/kde -> target
      - uses: actions/download-artifact@v4
        with:
          name: dictionary
          path: target/dictionary
      - run: cargo install --locked cargo-deb
      - name: Build the daemon and the settings window
        run: |
          cargo build --release --locked -p easime
          cargo build --release --locked --manifest-path settings/kde/Cargo.toml
      - name: Make the .deb
        run: cargo deb -p easime --no-build
      - name: Show package contents
        run: |
          dpkg-deb -I target/debian/*.deb
          dpkg-deb -c target/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: part-deb
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 7

  verify-rpm:
    name: Install the .rpm in a clean Fedora
    needs: rpm
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: part-rpm
          path: pkgs
      - name: Install the package with its dependencies
        run: |
          ls -l pkgs
          dnf -y install desktop-file-utils dejavu-sans-fonts ./pkgs/*.rpm
      - name: Everything is where the menu, KWin and the daemon look for it
        run: |
          rpm -q --requires easime
          rpm -q --recommends easime
          test -x /usr/bin/easime
          test -x /usr/bin/easime-settings
          desktop-file-validate /usr/share/applications/easime.desktop
          desktop-file-validate /usr/share/applications/easime-settings.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/easime.png
          test -f /usr/share/icons/hicolor/scalable/apps/easime.svg
          size="$(stat -c %s /usr/share/easime/dictionary/mozc.bin)"
          echo "installed dictionary: $size bytes"
          test "$size" -gt 10000000
      - name: Start the installed daemon and settings window
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          XDG_RUNTIME_DIR: /tmp
          XDG_CURRENT_DESKTOP: KDE
          QT_LOGGING_TO_CONSOLE: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          LANG: C.UTF-8
        run: |
          export HOME="$PWD/home"; mkdir -p "$HOME" shots
          # Without a compositor the daemon cannot serve, but it must start,
          # find its libraries and say why it stops.
          set +e
          env -u WAYLAND_DISPLAY easime > daemon.log 2>&1
          code=$?
          set -e
          cat daemon.log
          test "$code" = 1
          grep -q '^easime: ' daemon.log
          set +e
          timeout 120 easime-settings --ui-language=en --screenshots="$PWD/shots" > settings.log 2>&1
          code=$?
          set -e
          cat settings.log
          test "$code" = 0
          grep -q 'SETTINGS-WINDOW-LOADED pages=5' settings.log
          test "$(grep -c 'SCREENSHOT .* true' settings.log)" = 9
          # In a KDE session the installed easime.desktop is found, so the window
          # offers to select it (and the tour undoes it).
          grep -q 'INTERACTION activation-before state=other' settings.log
          grep -q 'INTERACTION activation-undone state=other undo=false result=deactivated' settings.log
          if grep -E 'qrc:/|<Unknown File>|TypeError|ReferenceError|is not installed|is not a type|nable to assign|annot assign|is not defined|failed to load' settings.log \
              | grep -v 'Created graphical object was not placed in the graphics scene'; then
            echo "QML reported warnings or errors (above)"; exit 1
          fi

  verify-deb:
    name: Install the .deb in a clean Debian 13
    needs: deb
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: part-deb
          path: pkgs
      - name: Install the package with its dependencies
        run: |
          ls -l pkgs
          apt-get update
          apt-get install -y --no-install-recommends desktop-file-utils fonts-dejavu-core ./pkgs/*.deb \
            || { echo "--- what Debian calls the QML modules:"; apt-cache search qml6-module | grep -iE 'kirigami|qml6-module-org-kde-desktop'; exit 1; }
      - name: Everything is where the menu, KWin and the daemon look for it
        run: |
          dpkg -s easime | grep -E '^(Depends|Recommends):'
          test -x /usr/bin/easime
          test -x /usr/bin/easime-settings
          desktop-file-validate /usr/share/applications/easime.desktop
          desktop-file-validate /usr/share/applications/easime-settings.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/easime.png
          test -f /usr/share/icons/hicolor/scalable/apps/easime.svg
          size="$(stat -c %s /usr/share/easime/dictionary/mozc.bin)"
          echo "installed dictionary: $size bytes"
          test "$size" -gt 10000000
      - name: Start the installed daemon and settings window
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          XDG_RUNTIME_DIR: /tmp
          XDG_CURRENT_DESKTOP: KDE
          QT_LOGGING_TO_CONSOLE: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          LANG: C.UTF-8
        run: |
          export HOME="$PWD/home"; mkdir -p "$HOME" shots
          set +e
          env -u WAYLAND_DISPLAY easime > daemon.log 2>&1
          code=$?
          set -e
          cat daemon.log
          test "$code" = 1
          grep -q '^easime: ' daemon.log
          set +e
          timeout 120 easime-settings --ui-language=en --screenshots="$PWD/shots" > settings.log 2>&1
          code=$?
          set -e
          cat settings.log
          test "$code" = 0
          grep -q 'SETTINGS-WINDOW-LOADED pages=5' settings.log
          test "$(grep -c 'SCREENSHOT .* true' settings.log)" = 9
          # In a KDE session the installed easime.desktop is found, so the window
          # offers to select it (and the tour undoes it).
          grep -q 'INTERACTION activation-before state=other' settings.log
          grep -q 'INTERACTION activation-undone state=other undo=false result=deactivated' settings.log
          if grep -E 'qrc:/|<Unknown File>|TypeError|ReferenceError|is not installed|is not a type|nable to assign|annot assign|is not defined|failed to load' settings.log \
              | grep -v 'Created graphical object was not placed in the graphics scene'; then
            echo "QML reported warnings or errors (above)"; exit 1
          fi

  # One download with both packages, for the Actions run page (CI) and for the
  # release workflow. Only after each package installed and started.
  collect:
    name: Both packages in one download
    needs: [rpm, deb, verify-rpm, verify-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: packages
      - run: ls -l packages
      - name: Expect exactly one .rpm and one .deb
        run: |
          test "$(ls packages | wc -l)" = 2
          ls packages/*.rpm packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: easime-linux-packages-${{ github.sha }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30
