[package]
name = "frontend-wayland"
description = "Wayland input method frontend (zwp_input_method_v1) for KWin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ime-core = { path = "../ime-core" }
easime-config = { path = "../easime-config" }
ime-session = { path = "../ime-session" }
engine-japanese = { path = "../engine-japanese" }
wayland-client = "0.31"
wayland-scanner = "0.31"
xkbcommon = "0.8"
rustix = { version = "1", features = ["event", "time", "fs"] }
ab_glyph = "0.2.32"
fontdb = "0.24.0"

[dev-dependencies]
wayland-server = "0.31"
wayland-backend = "0.3"
rustix = { version = "1", features = ["fs"] }
png = "0.18.1"
