[package]
name = "frontend-tsf"
description = "Windows text service (TSF) frontend for easime: key handling that needs no Windows API, and later the COM parts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# A DLL for Windows to load (the exports are in lib.rs), and a library for the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
ime-core = { path = "../ime-core" }
ime-session = { path = "../ime-session" }
easime-config = { path = "../easime-config" }

# The COM parts talk to Windows through Microsoft's own bindings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
] }
