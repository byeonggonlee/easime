[package]
name = "easime-config"
description = "Settings schema and TOML persistence shared by easime frontends and settings apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ime-core = { path = "../ime-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# Windows keeps the user's languages in the system, not in environment
# variables (crates/easime-config/src/locale.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }
