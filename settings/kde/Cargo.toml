[package]
name = "easime-settings"
description = "easime settings window for KDE Plasma (Qt 6 and Kirigami)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/byeonggonlee/easime"
publish = false

# Its own workspace: this needs Qt 6 and Kirigami, which the main workspace
# (and the OS independent CI jobs) must not require.
[workspace]

[dependencies]
easime-config = { path = "../../crates/easime-config" }
ime-core = { path = "../../crates/ime-core" }
# What the pages show and how a change is saved (no Qt), shared with the
# Windows settings app.
easime-settings-model = { path = "../../crates/easime-settings-model" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
# The record of what the activation page changed, to undo it (activation.rs).
toml_edit = "0.25"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

# The settings window is packaged together with the daemon: the metadata is in
# crates/easime/Cargo.toml.
